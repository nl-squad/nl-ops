name: Restart

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string

permissions:
  contents: read

jobs:
  restart:
    name: Restart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: /project-definition.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nl-ops
          sparse-checkout: |
            /mynl.sh
            /known_hosts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restart
        env:
          PROFILE: ${{ inputs.profile }}
          MYNL_SSH_KEY: ${{ runner.temp }}/vps_key
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
          RCON_PASSWORD: ${{ secrets[format('{0}_RCON_PASSWORD', inputs.profile == 'public' && 'PUBLIC' || 'DEV')] }}
        run: |
          (umask 077 && printf '%s\n' "$VPS_PRIVATE_KEY" > "$MYNL_SSH_KEY")
          .nl-ops/mynl.sh logs 500 || true
          .nl-ops/mynl.sh history || true
          .nl-ops/mynl.sh restart
