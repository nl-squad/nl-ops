name: Deploy

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      ref:
        description: Caller commit, branch or tag to deploy (default is the triggering commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: nl-ops-${{ inputs.profile }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nl-ops
          sparse-checkout: |
            /mynl.sh
            /known_hosts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Deploy
        env:
          PROFILE: ${{ inputs.profile }}
          MYNL_SSH_KEY: ${{ runner.temp }}/vps_key
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
          RCON_PASSWORD: ${{ secrets[format('{0}_RCON_PASSWORD', inputs.profile == 'public' && 'PUBLIC' || 'DEV')] }}
          G_PASSWORD: ${{ secrets[format('{0}_G_PASSWORD', inputs.profile == 'public' && 'PUBLIC' || 'DEV')] }}
        run: |
          (umask 077 && printf '%s\n' "$VPS_PRIVATE_KEY" > "$MYNL_SSH_KEY")
          .nl-ops/mynl.sh pack
          .nl-ops/mynl.sh deploy
